name: Create GitHub Release with Portable Packages

# Releases are cut from main by hand: bump package.json, push, then run this
# workflow with the same version. The tag is created only after every portable
# archive has been built and verified, so a failed release never leaves a tag
# behind that the updater or the Docker build could pick up.
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to release without the v prefix (a -suffix marks a prerelease on the beta channel)
        required: true
        type: string

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

env:
  RELEASE_ARTIFACT_PREFIX: RisuVault
  RELEASE_DISPLAY_NAME: RisuVault

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release-version.outputs.version }}
      notes: ${{ steps.release-version.outputs.notes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The tag v<version> is created by the release job once the archives are
      # verified; this step makes sure that tag will match package.json and
      # does not exist yet. scripts/check-standalone-release.mjs looks for this
      # step by name.
      - name: Verify tag matches package version
        id: release-version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Releases must run from main, got $GITHUB_REF" >&2
            exit 1
          fi
          if [[ ! "$REQUESTED_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must use X.Y.Z or X.Y.Z-prerelease format: $REQUESTED_VERSION" >&2
            exit 1
          fi
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PACKAGE_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "package.json is $PACKAGE_VERSION, requested $REQUESTED_VERSION" >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v${PACKAGE_VERSION}" >/dev/null 2>&1; then
            echo "Tag already exists: v${PACKAGE_VERSION}" >&2
            exit 1
          fi
          # patchnote/<version>.md becomes the release body when it exists;
          # GitHub's generated notes are appended either way. A note that is
          # present but headed for another version is a stale copy, so fail.
          NOTES="patchnote/${PACKAGE_VERSION}.md"
          if [ -s "$NOTES" ]; then
            if ! grep -Eqx "# ${RELEASE_DISPLAY_NAME} v?${PACKAGE_VERSION}" "$NOTES"; then
              echo "Release notes do not name this version: $NOTES" >&2
              exit 1
            fi
            echo "notes=${NOTES}" >> "$GITHUB_OUTPUT"
          else
            echo "No ${NOTES}; the release body will be generated from merged pull requests."
            echo "notes=" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify standalone release contract
        run: pnpm check:standalone-release

      - name: Verify release
        run: pnpm verify:release
        env:
          NODE_OPTIONS: '--max-old-space-size=4096'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-build
          path: |
            dist/
            server/
            packages/risubard-core/
            src/ts/risubard/
            package.json
            standalone-release.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            update.sh
            LICENSE
            NOTICE.md
          retention-days: 1

  portable:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
          - os: macos-latest
            platform: macos
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: app-build
          path: portable/

      # dist/ is prebuilt, so the portable only needs the server's runtime
      # dependency closure (~46MB) — not the full prod node_modules (~750MB).
      # The dependency list and its lockfile are committed at
      # scripts/portable/server-deps/; regenerating here verifies the committed
      # list still matches what the server actually requires, and the frozen
      # install keeps transitive versions reproducible.
      - name: Install server production dependencies
        shell: bash
        run: |
          # updater.cjs is a scan entry point, so it and the sibling it
          # requires have to be in place before the manifest is regenerated
          # from the shipped tree.
          mkdir -p portable/scripts
          cp scripts/updater.cjs portable/scripts/updater.cjs
          cp scripts/updater-recovery.cjs portable/scripts/updater-recovery.cjs
          node scripts/portable/gen-server-deps.cjs portable server-deps-check
          # --strip-trailing-cr: the Windows runner checks the committed file out with CRLF
          if ! diff -q --strip-trailing-cr server-deps-check/package.json scripts/portable/server-deps/package.json >/dev/null; then
            echo "scripts/portable/server-deps/ is stale — server dependencies changed."
            echo "Regenerate it (see the header of scripts/portable/gen-server-deps.cjs)."
            diff --strip-trailing-cr server-deps-check/package.json scripts/portable/server-deps/package.json || true
            exit 1
          fi
          mkdir server-deps
          cp scripts/portable/server-deps/package.json scripts/portable/server-deps/pnpm-lock.yaml server-deps/
          cd server-deps
          echo "node-linker=hoisted" > .npmrc
          # --ignore-workspace is required: cone-mode sparse checkout still
          # brings the repo-root pnpm-workspace.yaml (packages: ['.']), and
          # without this pnpm walks up, installs the app's own 69-dependency
          # root project into ../node_modules, and leaves this directory empty.
          pnpm install --prod --frozen-lockfile --ignore-workspace
          mv node_modules ../portable/node_modules
          # validatePackage (server/node/portable-update.cjs) checks node_modules
          # against this closure manifest, not the app package.json, because the
          # package deliberately contains only the closure. It ships as a flat
          # file directly under scripts/, never in a subdirectory: Phase 3 of
          # scripts/updater.cjs in every released portable copies scripts/ with
          # fs.copyFileSync over each directory entry, which throws on a
          # directory after server/, dist/ and node_modules/ have already been
          # swapped and outside the backup-restoring try/catch. Nothing may
          # create a directory under portable/scripts/.
          cp package.json ../portable/scripts/server-deps.json

      - name: Smoke test portable server
        shell: bash
        run: |
          cd portable
          LOG_FILE="$(mktemp)"
          SMOKE_DATA="$(mktemp -d)"
          PORT=0 RISU_UPDATE_CHECK=false RISUBARD_DATA_ROOT="$SMOKE_DATA" node server/node/server.cjs >"$LOG_FILE" 2>&1 &
          SERVER_PID=$!
          cleanup() {
            kill "$SERVER_PID" 2>/dev/null || true
            wait "$SERVER_PID" 2>/dev/null || true
            rm -f "$LOG_FILE"
          }
          trap cleanup EXIT
          for _ in {1..30}; do
            if grep -qE '\[Server\] (HTTP|HTTPS) server is running\.' "$LOG_FILE"; then
              exit 0
            fi
            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 1
          done
          cat "$LOG_FILE"
          exit 1

      - name: Download Node.js binary (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          NODE_VERSION="24.14.1"
          mkdir -p portable/bin
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-win-x64.zip" -o node.zip
          unzip -q node.zip
          cp "node-v${NODE_VERSION}-win-x64/node.exe" portable/bin/node.exe

      - name: Download Node.js binary (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          NODE_VERSION="24.14.1"
          NODE_ARCH="${{ matrix.arch }}"
          mkdir -p portable/bin
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-${NODE_ARCH}.tar.xz" -o node.tar.xz
          tar -xJf node.tar.xz
          cp "node-v${NODE_VERSION}-linux-${NODE_ARCH}/bin/node" portable/bin/node
          chmod +x portable/bin/node

      - name: Download Node.js binary (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          NODE_VERSION="24.14.1"
          mkdir -p portable/bin
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz" -o node.tar.gz
          tar -xzf node.tar.gz
          cp "node-v${NODE_VERSION}-darwin-arm64/bin/node" portable/bin/node
          chmod +x portable/bin/node

      - name: Download cloudflared (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          CLOUDFLARED_VERSION="2026.9.0"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-windows-amd64.exe" -o portable/bin/cloudflared.exe

      - name: Download cloudflared (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          CLOUDFLARED_VERSION="2026.9.0"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            CLOUDFLARED_ARCH="arm64"
          else
            CLOUDFLARED_ARCH="amd64"
          fi
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-linux-${CLOUDFLARED_ARCH}" -o portable/bin/cloudflared
          chmod +x portable/bin/cloudflared

      - name: Download cloudflared (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          CLOUDFLARED_VERSION="2026.9.0"
          curl -fsSL "https://github.com/cloudflare/cloudflared/releases/download/${CLOUDFLARED_VERSION}/cloudflared-darwin-arm64.tgz" -o cloudflared.tgz
          tar -xzf cloudflared.tgz
          mv cloudflared portable/bin/cloudflared
          chmod +x portable/bin/cloudflared

      - name: Build Windows launcher (.exe)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          node scripts/portable/png2ico.cjs \
            portable/dist/logo_16.png \
            portable/dist/logo_32.png \
            portable/dist/logo_256.png \
            scripts/portable/icon.ico
          cd scripts/portable
          GCC_DIR="$(dirname "$(which gcc)")"
          "$GCC_DIR/windres" launcher.rc -O coff -o launcher.res
          gcc -municode -O2 -o ../../portable/RisuVault.exe launcher.c launcher.res -lshell32
          rm -f launcher.res icon.ico

      - name: Create macOS app bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          APP="portable/RisuVault.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          ICONSET="$(mktemp -d)/AppIcon.iconset"
          mkdir -p "$ICONSET"
          for size in 16 32 128 256 512; do
            sips -z $size $size portable/dist/logo_512.png --out "$ICONSET/icon_${size}x${size}.png" >/dev/null 2>&1
          done
          for size in 32 64 256 512; do
            half=$((size / 2))
            sips -z $size $size portable/dist/logo_512.png --out "$ICONSET/icon_${half}x${half}@2x.png" >/dev/null 2>&1
          done
          cp "$ICONSET/icon_512x512.png" "$ICONSET/icon_512x512@2x.png"
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/AppIcon.icns"
          cat > "$APP/Contents/Info.plist" << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>RisuVault</string>
              <key>CFBundleName</key>
              <string>${RELEASE_DISPLAY_NAME}</string>
              <key>CFBundleIdentifier</key>
              <string>io.github.triplehwang.risuvault</string>
              <key>CFBundleVersion</key>
              <string>${VERSION}</string>
              <key>CFBundleShortVersionString</key>
              <string>${VERSION}</string>
              <key>CFBundleIconFile</key>
              <string>AppIcon</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>LSMinimumSystemVersion</key>
              <string>11.0</string>
          </dict>
          </plist>
          PLIST
          cat > "$APP/Contents/MacOS/RisuVault" << 'LAUNCHER'
          #!/bin/bash
          PORTABLE_DIR="$(cd "$(dirname "$0")/../../.." && pwd)"
          cd "$PORTABLE_DIR"
          PORT="${PORT:-7777}"
          if [ ! -f "bin/node" ]; then
              osascript -e 'display dialog "RisuVault.app must remain inside the standalone portable folder." buttons {"OK"} default button 1 with icon stop'
              exit 1
          fi
          (sleep 2 && open "http://localhost:$PORT") &
          osascript << ENDSCRIPT
          tell application "Terminal"
              activate
              do script "cd '$PORTABLE_DIR' && PORT=$PORT exec ./bin/node server/node/server.cjs"
          end tell
          ENDSCRIPT
          LAUNCHER
          chmod +x "$APP/Contents/MacOS/RisuVault"

      # update.bat runs the updater, finalizes the staged bin/ and version
      # marker, validates the result with the scripts/ copy of
      # portable-update.cjs, and rolls back through `updater.cjs --rollback`
      # when any of that fails.
      - name: Add update script (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          cp scripts/portable/V2-to-V1.bat portable/V2-to-V1.bat
          cp scripts/portable/update.bat portable/update.bat

      - name: Add launcher scripts (Unix)
        if: matrix.platform != 'win'
        shell: bash
        run: |
          cat > portable/start.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"
          export PORT="${PORT:-7777}"
          if command -v xdg-open >/dev/null 2>&1; then
              xdg-open "http://localhost:$PORT" 2>/dev/null &
          elif command -v open >/dev/null 2>&1; then
              open "http://localhost:$PORT" 2>/dev/null &
          fi
          bin/node server/node/server.cjs
          EOF
          # The updater removes .update-tmp itself on success; on failure it
          # holds the previous installation, so the script must not delete it.
          cat > portable/update.sh << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          cd "$SCRIPT_DIR"
          bin/node scripts/updater.cjs
          exit $?
          EOF
          cp scripts/portable/V2-to-V1.sh portable/V2-to-V1.sh
          chmod +x portable/start.sh portable/update.sh portable/V2-to-V1.sh

      - name: Add updater scripts and portable marker
        shell: bash
        run: |
          # scripts/updater.cjs and updater-recovery.cjs were staged by the
          # dependency install step, which needs them in place to regenerate
          # the manifest.
          test -f portable/scripts/updater.cjs
          test -f portable/scripts/updater-recovery.cjs
          test -f portable/scripts/server-deps.json
          # Phase 3 of the standalone updater copies each scripts/ entry with
          # fs.copyFileSync, which throws on a directory (EPERM on Windows,
          # EISDIR on Linux) after the installation is already half-swapped, so
          # a subdirectory here would break update.bat / update.sh for every
          # existing installation.
          if find portable/scripts -mindepth 1 -type d | grep -q .; then
            echo "portable/scripts/ must contain only files; the standalone updater cannot copy a directory:"
            find portable/scripts -mindepth 1 -type d
            exit 1
          fi
          # scripts/ survives every update phase while server/ is swapped out,
          # so update.bat validates through this copy of the helper.
          cp portable/server/node/portable-update.cjs portable/scripts/portable-update.cjs
          cp scripts/convert-v2-to-v0925.cjs portable/scripts/convert-v2-to-v0925.cjs
          touch portable/.portable

      - name: Package portable (Windows)
        if: matrix.platform == 'win'
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NAME="${RELEASE_ARTIFACT_PREFIX}-v${VERSION}-win-x64"
          cd portable
          7z a -tzip "../${NAME}.zip" .

      - name: Package portable (Unix)
        if: matrix.platform != 'win'
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NAME="${RELEASE_ARTIFACT_PREFIX}-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          mv portable "$NAME"
          tar -czf "${NAME}.tar.gz" "$NAME"
          rm -rf "$NAME"

      # Unpack the final archive into a fresh directory and check it with the
      # bundled Node: dependency closure, express loading, and an isolated
      # server start. This is what an end user's updater will run.
      - name: Verify the extracted release archive
        shell: bash
        run: |
          VERSION="${{ needs.build.outputs.version }}"
          NAME="${RELEASE_ARTIFACT_PREFIX}-v${VERSION}-${{ matrix.platform }}-${{ matrix.arch }}"
          VERIFY_DIR="$(mktemp -d)"
          if [ "${{ matrix.platform }}" = "win" ]; then
            7z x -y "${NAME}.zip" "-o${VERIFY_DIR}"
            ROOT="$VERIFY_DIR"
            NODE="$ROOT/bin/node.exe"
          else
            tar -xzf "${NAME}.tar.gz" -C "$VERIFY_DIR"
            ROOT="$VERIFY_DIR/$NAME"
            NODE="$ROOT/bin/node"
          fi
          "$NODE" scripts/portable-smoke.cjs "$ROOT" "$VERSION"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ env.RELEASE_ARTIFACT_PREFIX }}-*
          retention-days: 1

  release:
    needs:
      - build
      - portable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling and notes
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            scripts
            patchnote

      - name: Download all portable artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: portable-*
          merge-multiple: true

      - name: Generate verified update manifest
        run: node scripts/generate-update-manifest.mjs . "v${{ needs.build.outputs.version }}" "${{ github.repository }}"

      - name: Create release tag
        shell: bash
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" "$GITHUB_SHA" -m "${RELEASE_DISPLAY_NAME} v${VERSION}"
          git push origin "v${VERSION}"

      # A tag pushed with the workflow token does not fire docker-build.yml's
      # tag trigger, so dispatch it explicitly.
      - name: Publish Docker image
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: gh workflow run docker-build.yml --ref "v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: "${{ env.RELEASE_DISPLAY_NAME }} v${{ needs.build.outputs.version }}"
          target_commitish: ${{ github.sha }}
          body_path: ${{ needs.build.outputs.notes }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          files: |
            ${{ env.RELEASE_ARTIFACT_PREFIX }}-*
            update-manifest.json
